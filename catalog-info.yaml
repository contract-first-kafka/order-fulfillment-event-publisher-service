apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: event-publisher
  title: event-publisher
  description: Publishes selected order and shipment events using their governed schemas.
  annotations:
    backstage.io/kubernetes-id: event-publisher
    contract-first-idp.github.io/scm-provider: github
    contract-first-idp.github.io/scm-host: github.com
    contract-first-idp.github.io/domain-org: contract-first-kafka
    contract-first-idp.github.io/domain-repo: demo-domain
    contract-first-idp.github.io/repository-name: order-fulfillment-event-publisher-service
    contract-first-idp.github.io/implementation-profile: quarkus-camel-openapi
spec:
  type: service
  lifecycle: production
  owner: group:default/domain-maintainers
  system: system:default/order-fulfillment
  providesApis:
    - api:default/order-events
